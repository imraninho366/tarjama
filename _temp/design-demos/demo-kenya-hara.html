<!DOCTYPE html>
<!--
  ============================================================
  DEMO 1 · Kenya Hara · Eastern minimalism
  ============================================================
  Philosophy
    Hara teaches "emptiness is substance" — the void is not what's
    left over, it's the primary compositional element. Whiteness as
    a vessel for meaning, ceremonial restraint, no decoration that
    isn't reverence. Persimmon orange (#b13e1d) appears once, briefly,
    like a seal stamp on washi paper. Everything else is breath.

  Why this fits tarjama2
    The Quran is a sacred text. Hara's "white" register treats the
    text itself as the only ornament needed. The Arabic ب is no longer
    a "logo glyph" — it's a meditation object. The verse pull-quote
    isn't a card, it's a moment.

  Anti-references
    No cards. No gradients. No icons. No animation beyond breath.
    No filler. If a pixel doesn't earn reverence, it doesn't belong.
  ============================================================
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Tarjama · Kenya Hara direction</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Source+Sans+3:wght@200;300;400&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:    #f5efe4;
    --paper-2:  #ebe3d3;
    --ink:      #1c1815;
    --ink-soft: #76695b;
    --hairline: #d8cdbd;
    --seal:     #b13e1d;  /* persimmon · one accent, used like a stamp */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--paper); color: var(--ink); }
  body {
    font-family: 'Source Sans 3', system-ui, sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }
  /* mobile-first stage centered on larger viewports */
  .stage {
    width: 100%;
    max-width: 390px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 0;
    position: relative;
  }
  @media (min-width: 760px) {
    body { padding: 64px 0; background: var(--paper-2); }
    .stage { background: var(--paper); box-shadow: 0 1px 0 var(--hairline); min-height: auto; }
  }

  /* ── Hero · the ceremony ─────────────────────────────────── */
  .hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 14vh 28px 14vh;
    text-align: center;
    position: relative;
  }
  @media (min-width: 760px) { .hero { min-height: 720px; padding: 120px 32px; } }

  .glyph {
    font-family: 'Amiri', serif;
    font-weight: 400;
    font-size: 168px;
    line-height: 1;
    color: var(--seal);
    animation: breathe 7s ease-in-out infinite;
    margin-bottom: 56px;
    letter-spacing: 0;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1);      opacity: 1; }
    50%      { transform: scale(1.012); opacity: 0.96; }
  }

  .rule-thin {
    width: 1px;
    height: 56px;
    background: var(--ink);
    opacity: 0.18;
    margin-bottom: 40px;
  }

  .wordmark {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-size: 22px;
    letter-spacing: 18px;
    color: var(--ink);
    padding-left: 18px; /* compensate trailing letter-spacing */
    margin-bottom: 14px;
  }

  .arabic-line {
    font-family: 'Amiri', serif;
    font-weight: 400;
    font-size: 17px;
    color: var(--ink-soft);
    letter-spacing: 0;
    direction: rtl;
    margin-bottom: 80px;
  }

  .tagline {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 17px;
    color: var(--ink-soft);
    max-width: 280px;
    line-height: 1.55;
  }

  /* ── Verse · meditation ──────────────────────────────────── */
  .meditation {
    padding: 22vh 28px 18vh;
    text-align: center;
    border-top: 1px solid var(--hairline);
  }
  @media (min-width: 760px) { .meditation { padding: 160px 32px; } }

  .verse-mark {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: var(--seal);
    border-radius: 50%;
    margin-bottom: 64px;
    opacity: 0.85;
  }

  .verse-arabic {
    font-family: 'Amiri', serif;
    font-weight: 400;
    font-size: 32px;
    line-height: 2.3;
    color: var(--ink);
    direction: rtl;
    margin-bottom: 64px;
    letter-spacing: 0;
  }
  @media (min-width: 760px) { .verse-arabic { font-size: 40px; line-height: 2.1; } }

  .verse-french {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 19px;
    line-height: 1.7;
    color: var(--ink);
    max-width: 320px;
    margin: 0 auto 56px;
  }

  .citation {
    font-family: 'Source Sans 3', sans-serif;
    font-weight: 300;
    font-size: 10px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .citation .dot {
    display: inline-block;
    width: 4px; height: 1px;
    background: var(--ink-soft);
    vertical-align: middle;
    margin: 0 10px 3px;
    opacity: 0.5;
  }

  /* slow entrance · ceremonial timing (~1.5s, almost imperceptible) */
  .fade   { opacity: 0; animation: fade 1.6s 0.2s cubic-bezier(0.22,1,0.36,1) forwards; }
  .fade-1 { opacity: 0; animation: fade 1.6s 0.5s cubic-bezier(0.22,1,0.36,1) forwards; }
  .fade-2 { opacity: 0; animation: fade 1.6s 0.8s cubic-bezier(0.22,1,0.36,1) forwards; }
  .fade-3 { opacity: 0; animation: fade 1.6s 1.1s cubic-bezier(0.22,1,0.36,1) forwards; }
  @keyframes fade { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .glyph { animation: none; }
    .fade, .fade-1, .fade-2, .fade-3 { animation: none; opacity: 1; }
  }
</style>
</head>
<body>
<div class="stage">

  <!-- Hero · just the ceremony, nothing else -->
  <section class="hero">
    <div class="glyph fade">ب</div>
    <div class="rule-thin fade-1"></div>
    <div class="wordmark fade-1">TARJAMA</div>
    <div class="arabic-line fade-2">ترجمة</div>
    <div class="tagline fade-3">Apprends le Coran en traduisant, verset après verset.</div>
  </section>

  <!-- Verse · the meditation -->
  <section class="meditation">
    <span class="verse-mark"></span>
    <div class="verse-arabic" dir="rtl">إِنَّا أَنزَلْنَاهُ قُرْآنًا عَرَبِيًّا لَّعَلَّكُمْ تَعْقِلُونَ</div>
    <div class="verse-french">« Nous l'avons fait descendre, un Coran en arabe, afin que vous raisonniez. »</div>
    <div class="citation">Yusuf<span class="dot"></span>verset 2</div>
  </section>

</div>
</body>
</html>
